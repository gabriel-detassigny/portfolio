name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly rebuild to refresh GitHub stars, wordpress.org data and recent blog posts.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run lint

      - run: npm run check

      - run: npm test

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run test:e2e

      - run: cp deploy/.htaccess dist/

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::warning::Deploy secrets are not configured, skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.check.outputs.skip != 'true'
        with:
          name: site
          path: site/

      - name: Set up SSH
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload site
        if: steps.check.outputs.skip != 'true'
        run: |
          rsync -rlvz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            site/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
