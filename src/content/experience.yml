- id: immediate-media
  company: Immediate Media
  companyUrl: https://www.immediate.co.uk/
  role:
    en: Senior Backend PHP Developer
    fr: Développeur backend PHP senior
  start: 2019-01
  end: 2021-08
  location:
    en: London, UK
    fr: Londres, Royaume-Uni
  ref: london
  highlights:
    en:
      - Co-led the backend design of a new headless architecture for Immediate Media's WordPress multisite (about 100 million monthly users across its sites), launched first on the newly acquired BBC Good Food (about 50 million monthly unique users).
      - "Defined the API contracts for the frontend team and built three REST services with API Platform (Symfony), PHP 7.4, MongoDB and Docker: content such as recipes, per-site settings, and users' saved recipes."
      - Built the WordPress side that pushes content to these services automatically whenever a post is published, edited or deleted.
      - Load-tested the services with Artillery and profiled them with Blackfire to handle that traffic, on tight stakeholder deadlines.
      - Set up automated testing at every level, from unit and API tests to end-to-end tests.
      - Developed AWS Lambda functions with Bref for Amazon Alexa.
      - Mentored and coached mid-level developers.
    fr:
      - Co-pilotage de la conception backend d'une nouvelle architecture headless pour le WordPress multisite d'Immediate Media (environ 100 millions d'utilisateurs mensuels sur l'ensemble des sites), lancée d'abord sur BBC Good Food, récemment racheté (environ 50 millions de visiteurs uniques par mois).
      - "Définition des contrats d'API pour l'équipe frontend et développement de trois services REST avec API Platform (Symfony), PHP 7.4, MongoDB et Docker : contenus (dont les recettes), réglages par site et recettes enregistrées des utilisateurs."
      - Développement côté WordPress de l'envoi automatique des contenus vers ces services à chaque publication, modification ou suppression.
      - Tests de charge avec Artillery et profilage avec Blackfire pour tenir ce trafic, avec des délais serrés imposés par les parties prenantes.
      - 'Tests automatisés à tous les niveaux : unitaires, API et end-to-end.'
      - Développement de fonctions AWS Lambda avec Bref pour Amazon Alexa.
      - Mentorat de développeurs de niveau intermédiaire.
  stack: [PHP 7.4, API Platform, Symfony, MongoDB, WordPress, Docker, AWS Lambda, Artillery, Blackfire, Node.js, React]
  filters: [php, symfony, wordpress, javascript]

